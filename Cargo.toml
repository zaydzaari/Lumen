[package]
name = "lumen"
version = "0.1.2"
edition = "2021"
rust-version = "1.95"
description = "Lumen - a lightweight, open-source Spotify desktop client"
license = "MIT"
readme = "README.md"
default-run = "lumen"

[features]
default = ["tray", "media-controls"]
# System tray icon (tray-icon crate; pulls in GTK on Linux)
tray = ["dep:tray-icon"]
# OS media keys / now-playing integration (souvlaki)
media-controls = ["dep:souvlaki"]

[dependencies]
discord-rich-presence = "1.1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots", "rodio-backend"] }
librespot-connect = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-protocol = "=0.8.0"
protobuf = "=3.7.2"
protobuf-json-mapping = "=3.7.2"

rodio = { version = "0.21", default-features = false, features = ["playback"] }
lofty = { version = "=0.22.4", default-features = false }
walkdir = "2"
symphonia = { version = "=0.5.5", features = ["all"] }
symphonia-adapter-libopus = "=0.2.6"

eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "=0.36.2"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-bidi = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml = "0.9"
directories = "6"
url = "2"
open = "5"
sha2 = "0.10"
semver = "1"
base64 = "0.22"
rand = "0.9"

tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
tracing-appender = "0.2"
log = "0.4"
tracing-log = "0.2"

image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
lru = "0.16"
memory-stats = "1"
mlua = { version = "0.11", features = ["lua54", "vendored"] }

souvlaki = { version = "0.8", optional = true, default-features = false, features = ["use_zbus"] }
tray-icon = { version = "0.21", optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 1
[profile.dev.package."*"]
opt-level = 2

# `cargo build --profile profiling`: release speed with symbols, for heaptrack/perf.
[profile.profiling]
inherits = "release"
strip = false
debug = 1
lto = false
codegen-units = 16
