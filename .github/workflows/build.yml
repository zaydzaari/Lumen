name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: lumen-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libasound2-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev libxkbcommon-x11-0 libgl1-mesa-dev libwebkit2gtk-4.1-dev libssl-dev ffmpeg xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: node tests/verification_bridge.cjs
      - name: Synthetic audio conversion
        if: runner.os == 'Linux'
        run: cargo test --locked service_aac_response_is_converted_tagged_and_decodable -- --ignored
      - name: Synthetic segmented audio conversion
        if: runner.os == 'Linux'
        run: cargo test --locked service_hls_response_is_converted_tagged_and_decodable -- --ignored
      - name: Linux verification runtime smoke test
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a cargo test --locked native_webkit_fixture -- --ignored --test-threads=1
      - run: cargo build --release --locked
      - name: Linux release startup
        if: runner.os == 'Linux'
        run: |
          status=0
          timeout 15s dbus-run-session -- xvfb-run -a env -u WAYLAND_DISPLAY GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 target/release/lumen --demo || status=$?
          test "$status" -eq 124
      - name: Package Linux
        if: runner.os == 'Linux'
        run: bash packaging/linux/package.sh
      - name: Build Flatpak variant
        if: runner.os == 'Linux'
        run: |
          cargo clippy --all-targets --locked --no-default-features --features media-controls -- -D warnings
          cargo build --release --locked --no-default-features --features media-controls
      - name: Flatpak runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y flatpak
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --assumeyes --noninteractive --no-related flathub org.gnome.Platform//50
      - name: Package Flatpak
        if: runner.os == 'Linux'
        run: bash packaging/flatpak/package.sh
      - name: Check Flatpak runtime
        if: runner.os == 'Linux'
        run: |
          sudo flatpak install --assumeyes --noninteractive --no-related dist/*.flatpak
          flatpak run --command=sh io.github.zaydzaari.Lumen -c 'ldd /app/bin/lumen > /tmp/lumen-ldd; cat /tmp/lumen-ldd; ! grep -q "not found" /tmp/lumen-ldd'
          flatpak run --command=ffmpeg io.github.zaydzaari.Lumen -hide_banner -loglevel error -f lavfi -i sine=frequency=440:duration=0.1 -c:a libmp3lame -f mp3 - > /dev/null
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/lumen.exe dist/lumen-windows-x86_64.exe
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compilerPaths = @("${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe")
          $compiler = (Get-ChildItem -Path $compilerPaths -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (!$compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $compiler = (Get-ChildItem -Path $compilerPaths -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          }
          if (!$compiler) { throw "Inno Setup compiler was not found" }
          $appVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          & $compiler "/DAppVersion=$appVersion" packaging/windows/lumen.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
