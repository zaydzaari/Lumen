name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: lumen-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libasound2-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev libgl1-mesa-dev libwebkit2gtk-4.1-dev libssl-dev ffmpeg xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: node tests/verification_bridge.cjs
      - name: Synthetic audio conversion
        if: runner.os == 'Linux'
        run: cargo test --locked service_aac_response_is_converted_tagged_and_decodable -- --ignored
      - name: Linux verification runtime smoke test
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a cargo test --locked native_webkit_fixture -- --ignored --test-threads=1
      - run: cargo build --release --locked
      - name: Package Linux
        if: runner.os == 'Linux'
        run: bash packaging/linux/package.sh
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/lumen.exe dist/lumen-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
